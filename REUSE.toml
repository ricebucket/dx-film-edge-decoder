# Copyright and license of every file, in the REUSE format (https://reuse.software/),
# checked by `reuse lint` on GitHub. "override" makes these entries apply even where
# a file quotes other notices. Each file has one license: material under another
# license goes in a file of its own, with an entry here, its license text in
# LICENSES/ and its source listed in research/06.
version = 1

# Everything not matched below, including the transcription of the I3A list in
# data/i3a-2008/ and the page's copy of it in site/js/dx-data.js.
[[annotations]]
path = "**"
precedence = "override"
SPDX-FileCopyrightText = "2026 DX Film Edge Decoder contributors"
SPDX-License-Identifier = "GPL-3.0-only"

# An adapted subset of The Big Film Database (see data/README.md), the page's copy
# of it, and the screenshots and demo video that show its entries
# (`communityData` in scripts/screenshots.mjs, `DEMO` in scripts/demo-video.mjs).
[[annotations]]
path = [
  "data/big-film-database/**",
  "site/js/dx-data-community.js",
  ".github/screenshot*.png",
  "research/img/community-result*.png",
  ".github/demo*",
]
precedence = "override"
SPDX-FileCopyrightText = [
  "2018 Dxdatabase",
  "2026 DX Film Edge Decoder contributors",
]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# 11 expected symbols from Zint's test suite (backend/tests/test_dxfilmedge.c).
[[annotations]]
path = "tests/unit/zint-vectors.mjs"
precedence = "override"
SPDX-FileCopyrightText = [
  "2024-2025 Antoine Merino <antoine.merino.dev@gmail.com>",
  "2026 DX Film Edge Decoder contributors",
]
SPDX-License-Identifier = "BSD-3-Clause"
