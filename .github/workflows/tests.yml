name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm dependencies to install: the unit tests use node:test.
      - run: npm test

  licences:
    name: Licence check (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks that REUSE.toml gives every file a copyright notice and a licence
      # whose text is in LICENSES/.
      - uses: fsfe/reuse-action@v6

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Playwright is not a project dependency; install it on the runner only.
      - run: npm install -g @playwright/test@1.64.1 @axe-core/playwright@4.14.0
      - run: playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          # Step level: the runner context is not available in a job's env.
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: ${{ runner.temp }}/e2e
          retention-days: 7
