name: Tests and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm dependencies to install: the unit tests use node:test.
      - run: npm test

  licenses:
    name: License check (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks that REUSE.toml gives every file a copyright notice and a license
      # whose text is in LICENSES/.
      - uses: fsfe/reuse-action@v6

  browser:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Playwright is not a project dependency; install it on the runner only.
      - run: npm install -g @playwright/test@1.64.1 @axe-core/playwright@4.14.0
      - run: playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          # Step level: the runner context is not available in a job's env.
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # Publishes site/ to GitHub Pages from main, once every check above has
  # passed; not from forks, which have no Pages of their own set up. One-time
  # setup: in the repository's Settings → Pages, set "Source" to "GitHub
  # Actions".
  deploy:
    name: Deploy to GitHub Pages
    needs: [unit, licenses, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Deploys wait for their tests, so a newer push's can come first: an
      # older commit is then not published over it.
      - id: latest
        run: echo "yes=$([ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.latest.outputs.yes == 'true'
        uses: actions/configure-pages@v6
      - if: steps.latest.outputs.yes == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        if: steps.latest.outputs.yes == 'true'
        uses: actions/deploy-pages@v5
