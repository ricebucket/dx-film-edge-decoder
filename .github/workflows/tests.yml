name: Tests and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests and data check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm dependencies to install: the unit tests use node:test.
      - run: npm test

  licenses:
    name: License check (REUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Checks that REUSE.toml gives every file a copyright notice and a license
      # whose text is in LICENSES/.
      - uses: fsfe/reuse-action@v6

  # Four jobs at once, to save time: every test on the desktop, in three
  # parts, and on the two phones only the tests tagged @phone, which work
  # differently on a phone or run only there (tests/unit/e2e-tags.test.mjs
  # checks the tags). `npm run test:e2e` elsewhere runs every test on all three.
  browser:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      # Every job runs to the end, so that one run shows every failure.
      fail-fast: false
      matrix:
        include:
          - name: desktop, part 1 of 3
            tests: --project=desktop --shard=1/3
            browsers: chromium
          - name: desktop, part 2 of 3
            tests: --project=desktop --shard=2/3
            browsers: chromium
          - name: desktop, part 3 of 3
            tests: --project=desktop --shard=3/3
            browsers: chromium
          - name: phones
            tests: --project=android --project=iphone --grep @phone
            browsers: chromium webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Playwright is not a project dependency; install it on the runner only.
      - run: npm install -g @playwright/test@1.64.1 @axe-core/playwright@4.14.0
      - run: playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run test:e2e -- ${{ matrix.tests }}
        env:
          # Step level: the runner context is not available in a job's env.
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # Publishes site/ to GitHub Pages from main, once every check above has
  # passed; not from forks, which have no Pages of their own set up. One-time
  # setup: in the repository's Settings → Pages, set "Source" to "GitHub
  # Actions".
  deploy:
    name: Deploy to GitHub Pages
    needs: [unit, licenses, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.fork
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Deploys wait for their tests, so a newer push's can come first: an
      # older commit is then not published over it. If main can't be read,
      # the job fails rather than skip without a word. Should the site ever
      # lag behind main (say, the newer push's run failed), "Run workflow" on
      # main in the Actions tab publishes it again.
      - id: latest
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "Could not read main from origin." >&2; exit 1; }
          echo "yes=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.latest.outputs.yes == 'true'
        uses: actions/configure-pages@v6
      - if: steps.latest.outputs.yes == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        if: steps.latest.outputs.yes == 'true'
        uses: actions/deploy-pages@v5
