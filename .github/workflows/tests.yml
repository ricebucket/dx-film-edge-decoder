name: Tests and deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Playwright's version: its browsers are kept between runs under it.
  PLAYWRIGHT: 1.64.1

jobs:
  unit:
    name: Unit tests and data check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No npm dependencies to install: the unit tests use node:test.
      - run: npm test

  # Five jobs at once, to save time: every test on the desktop, in four
  # parts, and on the iPhone only the tests tagged @phone, which work
  # differently on a phone or run only there (tests/unit/e2e-tags.test.mjs
  # checks the tags). The Android phone is not run here: it is Chromium, as
  # the desktop is. `npm run test:e2e` elsewhere runs every test on all three.
  browser:
    name: Browser tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every job runs to the end, so that one run shows every failure.
      fail-fast: false
      matrix:
        include:
          # Of Chromium only the headless build, which is the one the tests run in.
          - name: desktop, part 1 of 4
            tests: --project=desktop --shard=1/4
            browsers: --only-shell chromium
          - name: desktop, part 2 of 4
            tests: --project=desktop --shard=2/4
            browsers: --only-shell chromium
          - name: desktop, part 3 of 4
            tests: --project=desktop --shard=3/4
            browsers: --only-shell chromium
          - name: desktop, part 4 of 4
            tests: --project=desktop --shard=4/4
            browsers: --only-shell chromium
          - name: iPhone
            tests: --project=iphone --grep @phone
            browsers: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Playwright is not a project dependency; install it on the runner only.
      - run: npm install -g @playwright/test@${{ env.PLAYWRIGHT }} @axe-core/playwright@4.14.0
      # Its browsers are kept from one run to the next, so that only a new
      # version downloads them. The system packages they need are installed
      # each time. The key names the runner's Ubuntu release: WebKit is built
      # for one release, and a build kept from another does not start.
      - id: system
        run: . /etc/os-release && echo "release=$VERSION_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.system.outputs.release }}-${{ env.PLAYWRIGHT }}-${{ contains(matrix.browsers, 'webkit') && 'webkit' || 'chromium-shell' }}
      - run: playwright install --with-deps ${{ matrix.browsers }}
      - run: npm run test:e2e -- ${{ matrix.tests }}
        env:
          # Step level: the runner context is not available in a job's env.
          E2E_OUTPUT_DIR: ${{ runner.temp }}/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: ${{ runner.temp }}/e2e
          retention-days: 7

  # Publishes site/ to GitHub Pages from main, once every check above has
  # passed; not from forks, which have no Pages of their own set up. One-time
  # setup: in the repository's Settings → Pages, set "Source" to "GitHub
  # Actions".
  deploy:
    name: Deploy to GitHub Pages
    needs: [unit, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Deploys wait for their tests, so a newer push's can come first: an
      # older commit is then not published over it. If main can't be read,
      # the job fails rather than skip without a word. Should the site ever
      # lag behind main (say, the newer push's run failed), "Run workflow" on
      # main in the Actions tab publishes it again.
      - id: latest
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "Could not read main from origin." >&2; exit 1; }
          echo "yes=$([ "$head" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      # Stamps this commit into the copy published (scripts/stamp-build.mjs):
      # the page then stops on lookup code and data of two deploys mixed in a
      # browser's cache, asks for a reload when the photo reader it loads
      # later is of another deploy, and asks for its scripts by build, so
      # browsers fetch them anew.
      - if: steps.latest.outputs.yes == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - if: steps.latest.outputs.yes == 'true'
        run: node scripts/stamp-build.mjs "${GITHUB_SHA::12}" site
      - if: steps.latest.outputs.yes == 'true'
        uses: actions/configure-pages@v6
      - if: steps.latest.outputs.yes == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        if: steps.latest.outputs.yes == 'true'
        uses: actions/deploy-pages@v5
